# Values for the upstream hashicorp/vault chart.
#
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm install vault hashicorp/vault -n vault --create-namespace \
#     -f deploy/vault/values.yaml
#
# Vault holds the tenant registry the reconciler reads. Reached from inside the
# cluster; nothing here exposes it.

global:
  tlsDisable: true

injector:
  enabled: false

server:
  # Dev mode keeps everything in memory and starts unsealed — fine for a
  # demo cluster, never for anything that must survive a restart.
  dev:
    enabled: true
    devRootToken: "root"

  logLevel: info

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  service:
    enabled: true
    type: ClusterIP

  standalone:
    enabled: false
  ha:
    enabled: false

  dataStorage:
    enabled: false
  auditStorage:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false
