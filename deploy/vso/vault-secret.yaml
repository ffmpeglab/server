apiVersion: v1
kind: ServiceAccount
metadata:
  name: ffmpeglab-vault
  namespace: ${VSO_NAMESPACE}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ${VSO_RELEASE}
  namespace: ${VSO_NAMESPACE}
spec:
  method: ${VSO_METHOD}
  mount: ${VSO_MOUNT}
  ${VSO_METHOD}:
    role: ${VSO_ROLE}
    serviceAccount: ffmpeglab-vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ${VSO_RELEASE}
  namespace: ${VSO_NAMESPACE}
spec:
  type: kv-v2
  mount: ${VSO_SECRET_MOUNT}
  path: ${VSO_PATH}
  vaultAuthRef: ${VSO_RELEASE}
  refreshAfter: ${VSO_REFRESH}

  destination:
    name: ${VSO_RELEASE}-credentials
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ^db$
        - ^database$

  # Credentials arrive through envFrom, which is read once at start.
  rolloutRestartTargets:
    - kind: Deployment
      name: ${VSO_RELEASE}-api
    - kind: Deployment
      name: ${VSO_RELEASE}-render
    - kind: Deployment
      name: ${VSO_RELEASE}-file
    - kind: Deployment
      name: ${VSO_RELEASE}-logs
