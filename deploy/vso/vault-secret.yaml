# Fill in <namespace>, <role>, <path> and <release>, then apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ffmpeglab-vault
  namespace: <namespace>
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ffmpeglab
  namespace: <namespace>
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: <role>
    serviceAccount: ffmpeglab-vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ffmpeglab
  namespace: <namespace>
spec:
  type: kv-v2
  mount: secret
  path: <path>
  vaultAuthRef: ffmpeglab
  refreshAfter: 60s

  destination:
    name: ffmpeglab-credentials
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ^db$
        - ^database$

  # Credentials arrive through envFrom, which is read once at start.
  rolloutRestartTargets:
    - kind: Deployment
      name: <release>-api
    - kind: Deployment
      name: <release>-render
    - kind: Deployment
      name: <release>-file
    - kind: Deployment
      name: <release>-logs
