# One release == one tenant == one Supabase project. Supabase is not deployed here.

tenant:
  name: ""

image:
  repository: ffmpeglab/server
  tag: "0.3.18"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Passed through verbatim; no variable name is hardcoded in the templates.
env: {}
  # DB_PORT: "5432"
  # S3_REGION: "us-east-1"
  # DOCUMENT_DIRECTORY: /tmp/ffmpeglab

# Secret with the tenant's credentials, normally produced from Vault.
existingSecret: ""

# Local testing only.
secret:
  create: false
  data: {}
    # DB_HOST: db.example.internal
    # DB_PASSWORD: change-me

# Each pod opens ~4 DB connections and the pooler caps a project at 15 in
# session mode, so old+new side by side during a rollout exhausts it.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# The app exits rather than retries when the database hostname does not resolve,
# so hold pods back until cluster DNS answers for it.
dnsWait:
  enabled: true
  hostFrom: DB_HOST
  image: busybox:1.36
  attempts: 60
  intervalSeconds: 2

# Ephemeral by design. Must match the app's document directory.
documentDir:
  mountPath: /tmp/ffmpeglab
  sizeLimit: 10Gi
  medium: ""

api:
  enabled: true
  replicaCount: 1
  env: {}
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  probes:
    enabled: true
    path: /
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Render and file share a process: render writes to local disk, file reads the
# same path, so splitting them across pods would need shared storage.
worker:
  enabled: true
  replicaCount: 1
  env:
    IS_RENDER_RUNNER: "true"
    IS_FILE_RUNNER: "true"
  mountDocumentDir: true
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Only useful once the render output is handed over through object storage.
file:
  enabled: false
  replicaCount: 1
  env:
    IS_FILE_RUNNER: "true"
  mountDocumentDir: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

logs:
  enabled: true
  replicaCount: 1
  env:
    IS_LOGS_RUNNER: "true"
  mountDocumentDir: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
