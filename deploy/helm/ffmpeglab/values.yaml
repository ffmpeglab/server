# One release is one FFmpegLab instance. See deploy/README.md.

image:
  repository: ffmpeglab/server
  tag: "0.6.4"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Passed through verbatim; no variable name is hardcoded in the templates.
env: {}

existingSecret: ""

# For clusters where no external controller supplies the Secret.
secret:
  create: false
  data: {}

# maxSurge 0: old+new side by side would exhaust the database connection cap.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# The app exits rather than retries when DB_HOST does not resolve yet.
dnsWait:
  enabled: true
  hostFrom: DB_HOST
  image: busybox:1.36
  attempts: 60
  intervalSeconds: 2

# Render's working directory. See deploy/README.md.
documentDir:
  mountPath: /tmp/ffmpeglab
  persistence:
    enabled: true
    existingClaim: ""
    # Render replicas spread over several nodes need ReadWriteMany.
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: ""
  sizeLimit: 10Gi
  medium: ""

# On every Deployment, merged with <component>.deploymentAnnotations (component wins).
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

api:
  enabled: true
  replicaCount: 1
  env: {}
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # Readiness and liveness paths can differ; see deploy/README.md.
  probes:
    enabled: true
    path: /api-json
    readinessPath: ""
    livenessPath: ""
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
    livenessFailureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  deploymentAnnotations: {}

# No CPU limit on purpose: a limit throttles rather than reallocates.
render:
  enabled: true
  replicaCount: 1
  env:
    IS_RENDER_RUNNER: "true"
  mountDocumentDir: true
  # ffmpeg runs inside bubblewrap, as in docker-compose.yml; replaces the global securityContext.
  securityContext:
    capabilities:
      add:
        - SYS_ADMIN
    seccompProfile:
      type: Unconfined
    appArmorProfile:
      type: Unconfined
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  deploymentAnnotations: {}

logs:
  enabled: true
  replicaCount: 1
  env:
    IS_LOGS_RUNNER: "true"
  mountDocumentDir: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  deploymentAnnotations: {}

podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
