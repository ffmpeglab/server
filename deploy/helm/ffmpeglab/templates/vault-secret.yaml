{{- if .Values.vaultSecret.enabled }}
{{- $secretName := .Values.existingSecret | default (printf "%s-supabase" (include "ffmpeglab.fullname" .)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vaultSecret.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffmpeglab.labels" . | nindent 4 }}
---
# Vault checks this service account's token against the cluster, so the tenant
# holds no credential of its own.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "ffmpeglab.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffmpeglab.labels" . | nindent 4 }}
spec:
  method: {{ .Values.vaultSecret.method }}
  mount: {{ .Values.vaultSecret.mount }}
  {{- if eq .Values.vaultSecret.method "jwt" }}
  # Vault verifies the token against the cluster's public signing keys instead
  # of calling the cluster, which is what a private cluster needs.
  jwt:
    role: {{ .Values.vaultSecret.role }}
    serviceAccount: {{ .Values.vaultSecret.serviceAccountName }}
    audiences:
      - {{ .Values.vaultSecret.audience }}
  {{- else }}
  kubernetes:
    role: {{ .Values.vaultSecret.role }}
    serviceAccount: {{ .Values.vaultSecret.serviceAccountName }}
  {{- end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "ffmpeglab.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffmpeglab.labels" . | nindent 4 }}
spec:
  type: kv-v2
  mount: {{ .Values.vaultSecret.secretMount }}
  path: {{ printf "%s/%s" (trimSuffix "/" .Values.vaultSecret.path) .Values.tenant.name }}
  vaultAuthRef: {{ include "ffmpeglab.fullname" . }}
  refreshAfter: {{ .Values.vaultSecret.refreshAfter }}

  destination:
    name: {{ $secretName }}
    create: true

    # Without this the operator adds _raw, the whole record as one JSON string.
    # Every field in it is already a key of its own, and envFrom would put a
    # second copy of the password into the environment of every pod.
    transformation:
      excludeRaw: true
      {{- with .Values.vaultSecret.excludes }}
      excludes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  # The operator restarts the deployments itself, so a rotated password reaches
  # the pods without a pipeline run. Credentials arrive through envFrom, which
  # is read once at start and would otherwise stay stale until the next deploy.
  rolloutRestartTargets:
    {{- range $component := list "api" "render" "file" "logs" }}
    {{- if (index $.Values $component).enabled }}
    - kind: Deployment
      name: {{ include "ffmpeglab.fullname" $ }}-{{ $component }}
    {{- end }}
    {{- end }}
{{- end }}
