# Applied by ./deploy/deploy.sh on-prem, on top of the chart defaults.
# Replace the storage class and the hostname with the ones your cluster uses.
# Render is pinned to the node that carries the ReadWriteOnce disk.

documentDir:
  persistence:
    storageClass: csi-rawfile-default
    accessModes:
      - ReadWriteOnce

render:
  nodeSelector:
    kubernetes.io/hostname: drive
