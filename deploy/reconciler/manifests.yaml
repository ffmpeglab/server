apiVersion: v1
kind: Namespace
metadata:
  name: ffmpeglab-reconciler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciler
  namespace: ffmpeglab-reconciler
---
# Helm installs whatever a chart contains, so scoping this to a list of kinds
# breaks the moment the chart grows one. The blast radius is bounded by what
# the chart actually creates, not by this binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ffmpeglab-reconciler
subjects:
  - kind: ServiceAccount
    name: reconciler
    namespace: ffmpeglab-reconciler
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciler
  namespace: ffmpeglab-reconciler
spec:
  schedule: "*/2 * * * *"

  # A run that overlaps the previous one would fail on the state lock rather
  # than wait, so it is skipped instead.
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: reconciler
          restartPolicy: Never
          containers:
            - name: reconciler
              image: ffmpeglab-reconciler:local
              imagePullPolicy: IfNotPresent
              env:
                - name: VAULT_ADDR
                  valueFrom:
                    secretKeyRef:
                      name: vault-login
                      key: VAULT_ADDR
                - name: VAULT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: vault-login
                      key: VAULT_USERNAME
                - name: VAULT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vault-login
                      key: VAULT_PASSWORD
                - name: TF_VAR_FILE
                  value: demo.tfvars
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
