name: Kubernetes smoke test

# Runs after the image is built, so it exercises the image that was just pushed
# and pulls it exactly once. Not on pull requests: chart and docs edits do not
# need a cluster, and Docker Hub pulls are limited.
on:
  workflow_run:
    workflows: ["DockerHub"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to test'
        required: false
        default: 'main'

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: medyagh/setup-minikube@latest
        with:
          cpus: 2
          memory: 4000mb

      # Postgres with pgmq and MinIO, standing in for the tenant's Supabase.
      # Both come from GHCR and quay, so neither spends a Docker Hub pull. CI has
      # no Supabase credentials, hence the local stand-in for
      # object storage, so the file runner has somewhere to upload to.
      - name: Start the database fixture
        run: |
          kubectl create namespace fixture
          kubectl -n fixture apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels: {app: postgres}
            template:
              metadata:
                labels: {app: postgres}
              spec:
                containers:
                  - name: postgres
                    image: ghcr.io/pgmq/pg17-pgmq:latest
                    env:
                      - {name: POSTGRES_PASSWORD, value: smoketest}
                      - {name: POSTGRES_DB, value: postgres}
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "postgres"]
                      initialDelaySeconds: 5
                      periodSeconds: 3
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
          spec:
            replicas: 1
            selector:
              matchLabels: {app: minio}
            template:
              metadata:
                labels: {app: minio}
              spec:
                containers:
                  - name: minio
                    image: quay.io/minio/minio:latest
                    args: ["server", "/data"]
                    env:
                      - {name: MINIO_ROOT_USER, value: smokekey}
                      - {name: MINIO_ROOT_PASSWORD, value: smokesecret}
                    ports:
                      - containerPort: 9000
                    readinessProbe:
                      httpGet: {path: /minio/health/ready, port: 9000}
                      initialDelaySeconds: 5
                      periodSeconds: 3
          EOF
          kubectl -n fixture expose deployment postgres --port=5432 --target-port=5432
          kubectl -n fixture expose deployment minio --port=9000 --target-port=9000
          kubectl -n fixture rollout status deploy/postgres --timeout=180s
          kubectl -n fixture rollout status deploy/minio --timeout=240s

          # The application expects the bucket to exist — on Supabase it is
          # created from the dashboard, so nothing creates it here either.
          kubectl -n fixture run mc --rm -i --restart=Never --image=quay.io/minio/mc:latest --command -- \
            sh -c "mc alias set m http://minio.fixture.svc.cluster.local:9000 smokekey smokesecret && mc mb --ignore-existing m/smoke"

      - name: Install the chart
        run: |
          kubectl create namespace ffmpeglab-smoke
          kubectl -n ffmpeglab-smoke create secret generic tenant-db \
            --from-literal=DB_HOST=postgres.fixture.svc.cluster.local \
            --from-literal=DB_USER=postgres \
            --from-literal=DB_PASSWORD=smoketest \
            --from-literal=DB_NAME=postgres \
            --from-literal=S3_ENDPOINT=http://minio.fixture.svc.cluster.local:9000 \
            --from-literal=S3_ACCESS_KEY=smokekey \
            --from-literal=S3_SECRET_KEY=smokesecret \
            --from-literal=S3_BUCKET_ID=smoke

          helm install smoke deploy/helm/ffmpeglab \
            --namespace ffmpeglab-smoke \
            --set tenant.name=smoke \
            --set existingSecret=tenant-db \
            --set image.tag=${{ github.event.inputs.image_tag || 'main' }} \
            --set env.DB_PORT=5432 \
            --set env.DB_MIGRATION_ENABLED=true \
            --set env.DOCUMENT_DIRECTORY=/tmp/ffmpeglab \
            --set env.S3_REGION=us-east-1 \
            --set api.resources.requests.cpu=50m \
            --set render.resources.requests.cpu=100m \
            --set file.resources.requests.cpu=50m \
            --set logs.resources.requests.cpu=50m

      # Not helm --wait: the chart sets maxUnavailable to 1, which with a single
      # replica satisfies helm's readiness check with zero ready pods, so it
      # returns in seconds while the pods are still initializing.
      - name: Wait for the pods
        run: |
          for c in api render file logs; do
            kubectl -n ffmpeglab-smoke rollout status "deploy/smoke-ffmpeglab-$c" --timeout=300s
          done

      - name: The application created its schema and queues
        run: |
          POD=$(kubectl -n fixture get pod -l app=postgres -o name | head -1)
          echo "POSTGRES_POD=$POD" >> "$GITHUB_ENV"
          kubectl -n fixture exec "$POD" -- psql -U postgres -d postgres -tAc \
            "select string_agg(tablename, ',' order by tablename) from pg_tables where schemaname='public';" | tee /tmp/tables
          grep -q 'api_key' /tmp/tables && grep -q 'log_piece' /tmp/tables && grep -q 'render' /tmp/tables
          kubectl -n fixture exec "$POD" -- psql -U postgres -d postgres -tAc \
            "select string_agg(queue_name, ',' order by queue_name) from pgmq.list_queues();" | tee /tmp/queues
          grep -q 'file' /tmp/queues && grep -q 'logs' /tmp/queues && grep -q 'render' /tmp/queues

      # example.sh is the project's own client, so this covers the path a user
      # actually takes: create a render, queue it, let the runner encode it.
      - name: A render completes
        run: |
          kubectl -n fixture exec "$POSTGRES_POD" -- psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc \
            "insert into api_key (title, apikey, user_id, data) values ('smoke', 'ffmpeglab_sk_smoketest', '00000000-0000-0000-0000-000000000001', '{}');"

          kubectl -n ffmpeglab-smoke port-forward svc/smoke-ffmpeglab-api 3000:3000 &
          for _ in $(seq 1 30); do curl -sf -m 2 http://localhost:3000/ >/dev/null && break; sleep 2; done

          sed 's|^API_HOST=.*|API_HOST=http://localhost:3000|' example.sh > /tmp/example.sh
          API_KEY=ffmpeglab_sk_smoketest bash /tmp/example.sh | tee /tmp/example.out

          ID=$(grep -oE '"id":"[a-f0-9-]{36}"' /tmp/example.out | head -1 | cut -d'"' -f4)
          [ -n "$ID" ] || { echo "no render id in the response"; exit 1; }
          echo "render $ID"

          for _ in $(seq 1 40); do
            STATUS=$(curl -s -m 10 -H "Authorization: Bearer ffmpeglab_sk_smoketest" \
              "http://localhost:3000/renders/$ID" | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
            echo "status: $STATUS"
            [ "$STATUS" = "done" ] && exit 0
            [ "$STATUS" = "error" ] && { echo "render failed"; exit 1; }
            sleep 5
          done
          echo "render did not finish in time"
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n ffmpeglab-smoke get pods -o wide || true
          kubectl -n ffmpeglab-smoke describe pods || true
          for c in api render file logs; do
            echo "----- $c -----"
            kubectl -n ffmpeglab-smoke logs "deploy/smoke-ffmpeglab-$c" --all-containers --tail=80 || true
          done
          kubectl -n fixture logs deploy/postgres --tail=40 || true
