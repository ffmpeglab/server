name: Deploy

on:
  release:
    types: [published]

  # Whatever writes a tenant into Vault should fire this so the cluster follows
  # immediately:
  #   curl -X POST -H "Authorization: Bearer <token>" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/ffmpeglab/server/dispatches \
  #     -d '{"event_type":"tenants-changed"}'
  repository_dispatch:
    types: [tenants-changed]

  workflow_dispatch:

# A scheduled run and a dispatch can land together. Both hold the same state
# lock, so the second would fail on the lock rather than wait; queueing them
# keeps the hourly safety net from turning into a red run.
concurrency:
  group: deploy-tenants
  cancel-in-progress: false

jobs:
  deploy:
    # Prereleases are not production. The environment carries the secrets and
    # any approval rules, so who can deploy is a repository setting rather than
    # something encoded here.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      # Logs of a public repository are readable by anyone, and everything below
      # prints cluster and tenant identifiers as a matter of course. Masking
      # them here means later steps are redacted without having to be careful.
      - name: Mask infrastructure identifiers
        run: |
          for v in "${{ vars.GCP_PROJECT_ID }}" "${{ vars.GKE_CLUSTER }}" \
                   "${{ vars.GKE_LOCATION }}" "${{ vars.TF_STATE_BUCKET }}" \
                   "${{ vars.DEPLOY_SA_EMAIL }}" "${{ vars.WIF_PROVIDER }}" \
                   "${{ vars.VAULT_ADDR }}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # No stored kubeconfig. The runner's OIDC token is exchanged for a
      # short-lived Google one, and credentials are fetched from the cluster as
      # it exists right now — so recreating the cluster cannot leave a stale
      # secret behind, and there is no long-lived key to rotate.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Both values come from the credentials just fetched, so neither has to be
      # stored anywhere and neither can go stale.
      - name: Note the cluster connection
        run: |
          echo "KUBECONFIG_PATH=$KUBECONFIG" >> "$GITHUB_ENV"
          echo "KUBE_CONTEXT=$(kubectl config current-context)" >> "$GITHUB_ENV"

      # A release deploys the image built from that release. Without this the
      # chart keeps whatever tag is pinned in values.yaml and publishing a
      # release changes nothing in the cluster.
      - name: Pick the image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ vars.DEPLOY_IMAGE_TAG }}"
          fi
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"

      # Exchanged for a token that lives as long as the run, so nothing
      # long-lived is stored and the password never reaches Terraform.
      - name: Log in to Vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_USERNAME: ${{ secrets.VAULT_USERNAME }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          token=$(curl -sf --max-time 30 \
            --data "{\"password\":\"$VAULT_PASSWORD\"}" \
            "$VAULT_ADDR/v1/auth/userpass/login/$VAULT_USERNAME" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["auth"]["client_token"])')
          [ -n "$token" ] || { echo "Vault login failed"; exit 1; }
          echo "::add-mask::$token"
          echo "VAULT_TOKEN=$token" >> "$GITHUB_ENV"

      # Terraform names every tenant in its plan, kubectl names their
      # namespaces and the summary lists them. Reading the registry first and
      # masking each id covers all three, and covers a tenant that appears in
      # this very run.
      - name: Mask tenant identifiers
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          list() {
            curl -sf --max-time 30 -H "X-Vault-Token: $VAULT_TOKEN" \
              "$VAULT_ADDR/v1/secret/metadata/tenants${1:+/$1}?list=true" \
              | jq -r '.data.keys[]? | rtrimstr("/")' || true
          }
          for user in $(list); do
            echo "::add-mask::$user"
            for project in $(list "$user"); do
              echo "::add-mask::$project"
            done
          done

      - name: Apply the tenant registry
        working-directory: deploy/terraform
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          TF_VAR_vault_token: ${{ env.VAULT_TOKEN }}
          TF_VAR_vault_address: ${{ vars.VAULT_ADDR }}
          TF_VAR_kube_context: ${{ env.KUBE_CONTEXT }}
          TF_VAR_kubeconfig_path: ${{ env.KUBECONFIG_PATH }}
          TF_VAR_image_tag: ${{ steps.image.outputs.tag }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform state list 2>/dev/null | grep '^helm_release' | sort > /tmp/before.txt || true
          terraform apply -input=false -auto-approve \
            -var-file="${{ vars.TF_VAR_FILE || 'gke.tfvars' }}"

      # Helm counts the rollout as done without waiting: one replica with
      # maxUnavailable 1 never breaches the budget, so a pod that cannot be
      # scheduled still reports success. Ask the deployments directly.
      - name: Wait for every tenant to be ready
        run: |
          failed=0
          for ns in $(kubectl get ns -l app.kubernetes.io/part-of=ffmpeglab -o name); do
            kubectl rollout status -n "${ns#namespace/}" deploy --timeout=180s || failed=1
          done
          exit $failed

      # A run that quietly adds a tenant looks exactly like a run that does
      # nothing, so say which ones arrived and which ones left.
      - name: Report what changed
        if: always()
        working-directory: deploy/terraform
        run: |
          terraform state list 2>/dev/null | grep '^helm_release' | sort > /tmp/after.txt || true
          slug() { sed 's|.*/||; s|"\]$||'; }
          added=$(comm -13 /tmp/before.txt /tmp/after.txt | slug)
          removed=$(comm -23 /tmp/before.txt /tmp/after.txt | slug)

          {
            echo "## Tenants"
            [ -n "$added" ]   && echo "$added"   | sed 's/^/- added /'
            [ -n "$removed" ] && echo "$removed" | sed 's/^/- removed /'
            [ -z "$added$removed" ] && echo "No change."
            echo
            echo "Running now: $(wc -l < /tmp/after.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
