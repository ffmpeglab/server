# A published release deploys to production (#8); see deploy/README.md.

name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        default: latest

# A release and a hand-started run can land together; one deploy at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A prerelease is not production.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Explicit rather than trusting whatever the runner image ships.
      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="$INPUT_TAG"
          # docker.yml tags images with the semver, so v0.4.3 publishes as 0.4.3.
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME#v}"
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Wait for the image
        # The image builds on the tag push, which races the release event.
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          tag="$TAG"
          for _ in $(seq 1 40); do
            if curl -sfo /dev/null "https://hub.docker.com/v2/repositories/ffmpeglab/server/tags/$tag"; then
              echo "ffmpeglab/server:$tag is published"
              exit 0
            fi
            sleep 30
          done
          echo "ffmpeglab/server:$tag never appeared" >&2
          exit 1

      - name: Tools
        # deploy.sh renders the operator manifest with envsubst.
        run: |
          command -v envsubst >/dev/null && exit 0
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Reach the cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version -o json >/dev/null

      - name: Configure the release
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          cat > deploy/.env <<EOF
          VAULT_ADDR=${{ vars.VAULT_ADDR }}
          VAULT_ROLE=${{ vars.VAULT_ROLE }}
          TENANT_PATH=${{ vars.TENANT_PATH }}
          VAULT_METHOD=${{ vars.VAULT_METHOD || 'jwt' }}
          VAULT_MOUNT=${{ vars.VAULT_MOUNT || 'jwt' }}
          IMAGE_TAG=$TAG
          DOCUMENT_ACCESS_MODE=${{ vars.DOCUMENT_ACCESS_MODE }}
          DOCUMENT_STORAGE_CLASS=${{ vars.DOCUMENT_STORAGE_CLASS }}
          DOCUMENT_EXISTING_CLAIM=${{ vars.DOCUMENT_EXISTING_CLAIM }}
          EOF

      - name: Deploy
        run: ./deploy/deploy.sh on-prem
