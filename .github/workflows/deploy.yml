name: Deploy

on:
  release:
    types: [published]

  # Whatever writes a tenant into Vault should fire this so the cluster follows
  # immediately:
  #   curl -X POST -H "Authorization: Bearer <token>" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/ffmpeglab/server/dispatches \
  #     -d '{"event_type":"tenants-changed"}'
  repository_dispatch:
    types: [tenants-changed]

  # Safety net for changes that arrive without firing the dispatch. The apply is
  # idempotent, so a run with nothing to do reports no changes and stops.
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      chart_values:
        description: 'Extra chart values as JSON'
        required: false
        default: '{}'

jobs:
  deploy:
    # Prereleases are not production. The environment carries the secrets and
    # any approval rules, so who can deploy is a repository setting rather than
    # something encoded here.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Passed through the environment rather than interpolated into the script,
      # so the kubeconfig never becomes part of a command line.
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG_PATH=$HOME/.kube/config" >> "$GITHUB_ENV"

      # A release deploys the image built from that release. Without this the
      # chart keeps whatever tag is pinned in values.yaml and publishing a
      # release changes nothing in the cluster.
      - name: Pick the image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ vars.DEPLOY_IMAGE_TAG }}"
          fi
          if [ -n "$tag" ]; then
            echo "values={\"image\":{\"tag\":\"${tag#v}\"}}" >> "$GITHUB_OUTPUT"
          else
            echo 'values={}' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the tenant registry
        working-directory: deploy/terraform
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          TF_VAR_vault_token: ${{ secrets.VAULT_TOKEN }}
          TF_VAR_vault_address: ${{ secrets.VAULT_ADDR }}
          TF_VAR_kube_context: ${{ vars.KUBE_CONTEXT }}
          TF_VAR_kubeconfig_path: ${{ env.KUBECONFIG_PATH }}
          TF_VAR_chart_values: ${{ github.event.inputs.chart_values || steps.image.outputs.values }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Report tenants
        if: always()
        working-directory: deploy/terraform
        run: terraform output -json tenants || true
